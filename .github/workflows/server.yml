name: Rust server

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Verify locked protocol schema snapshots
        run: python3 scripts/check-protocol-schema.py
      - name: Verify pinned WebSocket transport source and narrow compatibility patch
        run: python3 scripts/check-tungstenite-reconstruction.py --restore-reference
      - name: Verify exact Protobuf numeric compatibility patches
        run: python3 scripts/check-protobuf-reconstruction.py --restore-reference
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --locked --workspace --no-fail-fast
      - name: WebSocket close policy feature-off and feature-on conformance
        # always(): a red `Tests` step must not hide this verdict. The step stays
        # fatal, so its own failure still reddens the job.
        if: always()
        run: |
          CARGO_TARGET_DIR=target/websocket-close-policy cargo test --locked --manifest-path tests/conformance/websocket-close-policy/Cargo.toml --no-default-features
          CARGO_TARGET_DIR=target/websocket-close-policy cargo test --locked --manifest-path tests/conformance/websocket-close-policy/Cargo.toml --no-default-features --features livekit-policy
      - name: RSA public-only dependency boundary and mutation regressions
        # always(): a red `Tests` step must not hide this verdict. The step stays
        # fatal, so its own failure still reddens the job.
        if: always()
        run: python3 crates/rtc-tls/scripts/check-rsa-boundary.py --self-test
      - name: Dependency gate regression tests
        # always(): a red `Tests` step must not hide this verdict. The step stays
        # fatal, so its own failure still reddens the job.
        if: always()
        run: python3 scripts/test-check-dependencies.py
      - name: Architecture and production dependency graphs
        # always(): a red `Tests` step must not hide this verdict. The step stays
        # fatal, so its own failure still reddens the job.
        if: always()
        run: python3 scripts/check-dependencies.py
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-graph
          path: target/evidence/dependency-graph.json
          if-no-files-found: warn
          retention-days: 14
      - name: Clean Rust build products after evidence upload
        if: always()
        run: cargo clean

  # The two independent-OpenSSL legs are moved out of `quality` because they are
  # the only steps in that job measured to exceed a runner budget: at 14b0a13b
  # steps 1-11 took 558s and the expanded leg was still running when the job's
  # 30-minute ceiling cancelled it at 1818s, so every later step of `quality`
  # (dependency gate regression, architecture graphs) had never executed in any
  # run. Keeping them here gives them their own budget and stops one slow leg
  # from hiding the rest, which is the same reason each interop leg is its own
  # recorded step. 45 minutes is a bound, not a measurement: no run has ever
  # completed the expanded leg, so its true duration is still unknown.
  tls-openssl-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Verify locked protocol schema snapshots
        run: python3 scripts/check-protocol-schema.py
      - name: Verify pinned WebSocket transport source and narrow compatibility patch
        run: python3 scripts/check-tungstenite-reconstruction.py --restore-reference
      - name: Verify exact Protobuf numeric compatibility patches
        run: python3 scripts/check-protobuf-reconstruction.py --restore-reference
      - name: Independent OpenSSL TLS 1.3 interoperability
        run: RTC_TLS_OPENSSL=openssl cargo test -p rtc-tls --locked --test handshake independent_openssl_client_negotiates_tls13_and_verifies_certificate -- --ignored
      - name: Independent OpenSSL expanded TLS, key formats and RSA tampering regressions
        run: RTC_TLS_OPENSSL=openssl cargo test -p rtc-tls --locked --test expanded -- --ignored
      - name: Clean Rust build products
        if: always()
        run: cargo clean

  dependency-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check advisories, licenses, duplicate versions and sources
        run: cargo deny --locked --exclude-dev check
      - name: Clean Rust build products
        if: always()
        run: cargo clean

  linux-compilation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install frozen Rust toolchain and target standard library
        run: rustup toolchain install 1.99.0 --profile minimal --target ${{ matrix.target }}
      - name: Compile-check target (does not link or run target executables)
        run: cargo check --locked --workspace --target ${{ matrix.target }}
      - name: Clean Rust build products
        if: always()
        run: cargo clean

  browser-interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BROWSER_CHANNEL: chromium
      LIVEKIT_URL: ws://127.0.0.1:7980
      SERVER_LABEL: rust
      DURATION_MS: "10000"
      # Each media leg records its own conclusion through ci-leg.mjs. The legs run
      # with continue-on-error so one red leg cannot abort the ones after it, which
      # also keeps those failures out of the job verdict; ci-leg-summary.mjs re-applies
      # the gate from this file as the last step. Absolute path because the legs run
      # with working-directory tests/interop while the aggregator runs at the root.
      CI_STEP_RESULTS_FILE: ${{ github.workspace }}/tests/interop/output/ci-leg-results.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6, verified SHA
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/interop/package-lock.json
      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install locked interoperability dependencies
        working-directory: tests/interop
        run: npm ci
      - name: Install Playwright Chromium and operating-system dependencies
        working-directory: tests/interop
        run: npx playwright install --with-deps chromium
      - name: Generate short-lived local TLS certificates
        working-directory: tests/interop
        run: |
          npm run tls:fixture
          TLS_KEY_TYPE=rsa TLS_FIXTURE_NAME=tls-rsa npm run tls:fixture
      - name: Build Rust server binaries
        id: build
        run: cargo build --locked --bins
      - name: Start standalone Rust server
        id: server
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p tests/interop/output
          ./target/debug/livecloud --dev --bind 127.0.0.1 --port 7980 --rtc.tcp_port 7981 --udp-port 7982 >tests/interop/output/server.log 2>&1 &
          interop_server_pid=$!
          echo "INTEROP_SERVER_PID=$interop_server_pid" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import socket
          import time
          for attempt in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 7980), timeout=1):
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Rust server did not become ready on 127.0.0.1:7980")
          PY
      # From here on every media leg is wrapped by ci-leg.mjs and marked
      # continue-on-error: the wrapper records the real exit code, re-raises it so the
      # step still shows red on the run page, and the aggregation step fails the job.
      - name: Recorded fixture consistency and redaction
        continue-on-error: true
        working-directory: tests/interop
        run: node ci-leg.mjs fixtures -- npm run test:fixtures
      - name: Network impairment proxy regression tests
        continue-on-error: true
        working-directory: tests/interop
        run: node ci-leg.mjs netproxy -- node --test network-proxy.test.mjs bandwidth-accounting.test.mjs bandwidth-timeline-gate.test.mjs
      - name: Single-PC audio and reliable data, two independent runs
        continue-on-error: true
        working-directory: tests/interop
        env:
          RUNS: "2"
        run: node ci-leg.mjs single-pc -- npm test
      - name: Reconnect, republish, mute, metadata and RPC
        continue-on-error: true
        working-directory: tests/interop
        env:
          EXTENDED: "true"
          RUNS: "1"
        run: node ci-leg.mjs reconnect -- npm test
      - name: VP8 video with extended operations, audio and reliable data
        continue-on-error: true
        working-directory: tests/interop
        env:
          VIDEO: "true"
          EXTENDED: "true"
          RUNS: "1"
        run: node ci-leg.mjs vp8 -- npm test
      - name: VP9 L3T3_KEY spatial and temporal subscription switching
        continue-on-error: true
        working-directory: tests/interop
        env:
          VIDEO: "true"
          VIDEO_CODEC: vp9
          SCALABILITY_MODE: L3T3_KEY
          SVC_SWITCH: "true"
          SVC_TEMPORAL: "true"
          RUNS: "1"
        run: node ci-leg.mjs vp9 -- npm test
      - name: Dual-PC audio and reliable data
        continue-on-error: true
        working-directory: tests/interop
        env:
          SINGLE_PC: "false"
          RUNS: "1"
        run: node ci-leg.mjs dual-pc -- npm test
      # Join advertises the embedded TURN/TLS listener on 443 whatever the config
      # sets, so the fixtures listen on 443 too. Runners keep
      # net.ipv4.ip_unprivileged_port_start at 1024, and without this the bind
      # fails with EACCES and no browser ever reaches a TLS relay (run 466 recorded
      # TURN server stopped {"allocations": 0} for exactly that reason).
      - name: Allow job servers to bind port 443
        run: |
          sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
          sysctl -n net.ipv4.ip_unprivileged_port_start
      - name: Start independent TURN TLS Rust server
        id: turn-server
        if: steps.server.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          ./target/debug/livecloud --dev --config tests/interop/turn-tls-config.yaml >tests/interop/output/turn-tls-server.log 2>&1 &
          turn_tls_server_pid=$!
          echo "TURN_TLS_SERVER_PID=$turn_tls_server_pid" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import socket
          import time
          # TCP reachability only proves the sockets exist; the media leg still has
          # to assert the relay. Checking 443 here turns a refused privileged bind
          # into this step failing, instead of an unexplained ICE timeout later.
          for port in (8080, 443):
              for attempt in range(60):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      time.sleep(0.5)
              else:
                  raise SystemExit(f"TURN TLS server did not become ready on 127.0.0.1:{port}")
          PY
      - name: Original SDK audio and reliable data through authenticated TURN TLS
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: ws://127.0.0.1:8080
          SERVER_LABEL: rust-turn-tls
          FORCE_RELAY: "true"
          TURN_TLS: "true"
          RUNS: "1"
          DURATION_MS: "10000"
        # Trust only this generated local certificate, never disable all certificate verification.
        run: node ci-leg.mjs turn-tls -- 'TLS_SPKI="$(cat output/tls/spki-sha256.txt)" npm test'
      # Only runs when that leg is red: dumps the harness-side view needed to tell
      # ICE-never-relayed apart from a rejected pinned certificate or a dead TURN
      # listener. The trigger reads the recorded leg conclusion instead of an `if:`
      # expression, because a continue-on-error step has no unambiguous step outcome.
      # The step itself is tolerated: it is a diagnostic, and a crashing diagnostic
      # must not decide whether the legs behind it run. On run 45679262055 this step
      # threw inside the probe and that single failure skipped six never-executed legs.
      - name: Collect failed TURN TLS leg attribution evidence
        id: turn-tls-attribution
        if: always()
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: ws://127.0.0.1:8080
          SERVER_LABEL: rust-turn-tls
          FORCE_RELAY: "true"
          TURN_TLS: "true"
          RUNS: "1"
        run: |
          if node ci-leg.mjs --failed turn-tls; then
            node ci-leg-attribution.mjs
          else
            echo "turn-tls leg is not recorded as failed; no attribution evidence needed"
          fi
      - name: HTTPS Webhook signature, certificate trust and retry through production binary
        continue-on-error: true
        working-directory: tests/interop
        run: node ci-leg.mjs webhook -- node webhook-tls.mjs
      - name: Stop the TURN TLS instance before handing port 443 to the EC server
        id: stop-turn-tls
        if: always()
        run: |
          if [ -n "${TURN_TLS_SERVER_PID:-}" ]; then
            kill -TERM "$TURN_TLS_SERVER_PID" 2>/dev/null || true
            for attempt in {1..20}; do
              if ! kill -0 "$TURN_TLS_SERVER_PID" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -KILL "$TURN_TLS_SERVER_PID" 2>/dev/null || true
          fi
          echo "TURN_TLS_SERVER_PID=" >> "$GITHUB_ENV"
      # Both native HTTPS fixtures now serve embedded TURN/TLS on the advertised 443,
      # so they cannot coexist. They used to listen on 5349 and 5350 and did run at
      # the same time; what they never had was a relay on the port Join named.
      - name: Start native HTTPS-only EC server
        id: https-ec-server
        if: steps.server.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          ./target/debug/livecloud --dev --config tests/interop/native-https-config.yaml >tests/interop/output/native-https-ec-server.log 2>&1 &
          echo "NATIVE_HTTPS_EC_PID=$!" >> "$GITHUB_ENV"
          python3 - <<'PYWAIT'
          import socket
          import time
          for port in (8443, 443):
              for attempt in range(60):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      time.sleep(0.5)
              else:
                  raise SystemExit(f"Native HTTPS EC server did not become ready on {port}")
          PYWAIT
      - name: EC native HTTPS CA trust, wrong hostname, untrusted CA and disabled plaintext
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: wss://127.0.0.1:8443
          PLAIN_HTTP_PORT: "8480"
          PROBE_LABEL: ec
        run: node ci-leg.mjs https-ec-probe -- node probe-native-https.mjs
      - name: Original SDK native EC WSS, HTTPS API, TURN TLS and AV1 L3T3_KEY switching
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: wss://127.0.0.1:8443
          SERVER_LABEL: rust-native-https-av1
          FORCE_RELAY: "true"
          TURN_TLS: "true"
          VIDEO: "true"
          VIDEO_CODEC: av1
          SCALABILITY_MODE: L3T3_KEY
          SVC_SWITCH: "true"
          SVC_TEMPORAL: "true"
          RUNS: "1"
        # Node validates the HTTPS API with the test CA; Chromium gets only this leaf SPKI exception.
        run: node ci-leg.mjs native-ec-av1 -- 'NODE_EXTRA_CA_CERTS="$PWD/output/tls/root.pem" TLS_SPKI="$(cat output/tls/spki-sha256.txt)" npm test'
      - name: Stop the EC instance before handing port 443 to the RSA server
        id: stop-https-ec
        if: always()
        run: |
          if [ -n "${NATIVE_HTTPS_EC_PID:-}" ]; then
            kill -TERM "$NATIVE_HTTPS_EC_PID" 2>/dev/null || true
            for attempt in {1..20}; do
              if ! kill -0 "$NATIVE_HTTPS_EC_PID" 2>/dev/null; then break; fi
              sleep 0.25
            done
            kill -KILL "$NATIVE_HTTPS_EC_PID" 2>/dev/null || true
          fi
          echo "NATIVE_HTTPS_EC_PID=" >> "$GITHUB_ENV"
      - name: Start native HTTPS-only RSA PKCS1 server
        id: https-rsa-server
        if: steps.server.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          ./target/debug/livecloud --dev --config tests/interop/native-https-rsa-config.yaml >tests/interop/output/native-https-rsa-server.log 2>&1 &
          echo "NATIVE_HTTPS_RSA_PID=$!" >> "$GITHUB_ENV"
          python3 - <<'PYWAIT'
          import socket
          import time
          for port in (9443, 443):
              for attempt in range(60):
                  try:
                      with socket.create_connection(("127.0.0.1", port), timeout=1):
                          break
                  except OSError:
                      time.sleep(0.5)
              else:
                  raise SystemExit(f"Native HTTPS RSA server did not become ready on {port}")
          PYWAIT
      - name: RSA PKCS1 native HTTPS trust and disabled plaintext
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: wss://127.0.0.1:9443
          TLS_CA_FILE: output/tls-rsa/root.pem
          PLAIN_HTTP_PORT: "9480"
          PROBE_LABEL: rsa
        run: node ci-leg.mjs https-rsa-probe -- node probe-native-https.mjs
      - name: Original SDK native RSA PKCS1 WSS, HTTPS API and TURN TLS
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: wss://127.0.0.1:9443
          SERVER_LABEL: rust-native-https-rsa
          FORCE_RELAY: "true"
          TURN_TLS: "true"
          RUNS: "1"
        run: node ci-leg.mjs native-rsa -- 'NODE_EXTRA_CA_CERTS="$PWD/output/tls-rsa/root.pem" TLS_SPKI="$(cat output/tls-rsa/spki-sha256.txt)" npm test'
      - name: Start congestion recovery Rust server
        id: congestion-server
        if: steps.server.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          ./target/debug/livecloud --dev --config tests/interop/congestion-config.yaml >tests/interop/output/congestion-server.log 2>&1 &
          echo "CONGESTION_SERVER_PID=$!" >> "$GITHUB_ENV"
          python3 - <<'PYWAIT'
          import socket
          import time
          for attempt in range(60):
              try:
                  with socket.create_connection(("127.0.0.1", 8180), timeout=1):
                      break
              except OSError:
                  time.sleep(0.5)
          else:
              raise SystemExit("Congestion test server did not become ready")
          PYWAIT
      - name: Real TURN bottleneck and sustained media recovery
        continue-on-error: true
        working-directory: tests/interop
        env:
          LIVEKIT_URL: ws://127.0.0.1:8180
          SERVER_LABEL: rust-congestion
          RUNS: "5"
          VIDEO: "true"
          COMPLEX_VIDEO: "true"
          FORCE_RELAY: "true"
          NETWORK_PROFILE: congest-recover
          BANDWIDTH_ACCURACY: "true"
          METRICS_URL: http://127.0.0.1:9191/metrics
          DURATION_MS: "5000"
        run: node ci-leg.mjs congestion -- npm test
      # Re-apply the gate the continue-on-error legs relaxed: any leg that is red or
      # never recorded fails the job here, with every leg listed.
      - name: Aggregate recorded interoperability leg results
        id: aggregate
        if: always()
        run: node tests/interop/ci-leg-summary.mjs
      - name: Stop only job-owned standalone servers
        if: always()
        run: |
          owned_pids=("${CONGESTION_SERVER_PID:-}" "${NATIVE_HTTPS_RSA_PID:-}" "${NATIVE_HTTPS_EC_PID:-}" "${TURN_TLS_SERVER_PID:-}" "${INTEROP_SERVER_PID:-}")
          for pid in "${owned_pids[@]}"; do
            if [ -n "$pid" ]; then kill -TERM "$pid" 2>/dev/null || true; fi
          done
          for attempt in {1..20}; do
            alive=false
            for pid in "${owned_pids[@]}"; do
              if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null; then alive=true; fi
            done
            if [ "$alive" = false ]; then break; fi
            sleep 0.25
          done
          for pid in "${owned_pids[@]}"; do
            if [ -n "$pid" ]; then kill -KILL "$pid" 2>/dev/null || true; fi
          done
      - name: Upload interoperability evidence and server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chromium-interoperability
          path: |
            tests/interop/output/
            !tests/interop/output/**/*key*.pem
            !tests/interop/output/**/*.key
          if-no-files-found: warn
          retention-days: 14
      - name: Remove generated TLS materials and raw output after evidence upload
        if: always()
        run: rm -rf tests/interop/output
      - name: Clean Rust build products after evidence upload
        if: always()
        run: cargo clean

  official-cli:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install frozen Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Fetch and build exact official LiveKit test reference
        run: |
          official_source="$RUNNER_TEMP/livekit-official-source"
          official_binary="$RUNNER_TEMP/livekit-server-official"
          git init "$official_source"
          git -C "$official_source" remote add origin https://github.com/livekit/livekit.git
          git -C "$official_source" fetch --depth 1 origin e5655ac20267fa5005dccaf3f0e3bfc3ea688c07
          git -C "$official_source" checkout --detach FETCH_HEAD
          test "$(git -C "$official_source" rev-parse HEAD)" = e5655ac20267fa5005dccaf3f0e3bfc3ea688c07
          (
            cd "$official_source"
            GOTOOLCHAIN=go1.26.0 go build -o "$official_binary" ./cmd/server
          )
          echo "LIVEKIT_OFFICIAL_BIN=$official_binary" >> "$GITHUB_ENV"
      - name: Run opt-in official CLI and configuration differential tests
        run: cargo test -p lk-config --locked --test official_cli -- --ignored
      - name: Remove temporary official reference and binary
        if: always()
        run: rm -rf "$RUNNER_TEMP/livekit-official-source" "$RUNNER_TEMP/livekit-server-official"
      - name: Clean Rust build products
        if: always()
        run: cargo clean
