# RustCrypto aes 0.8 / polyval 0.6 require these cfgs to compile the ARMv8
# intrinsic implementations. Both retain cpufeatures runtime detection and
# software fallback; do not use target-cpu=native or require AES globally.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]
