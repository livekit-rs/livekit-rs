# Loopback-only development fixture for Chrome forced-relay interoperability.
# Start with: target/debug/livecloud --dev --config tests/interop/turn-config.yaml
# Development mode supplies the public test credentials devkey / secret.
port: 8080
bind_addresses:
  - 127.0.0.1
rtc:
  tcp_port: 8081
  udp_port: 8082
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
  ips:
    includes:
      - 127.0.0.1/32
turn:
  enabled: true
  udp_port: 3488
  bind_addresses:
    - 127.0.0.1
  relay_range_start: 36000
  relay_range_end: 36100
  allow_restricted_peer_cidrs:
    - 127.0.0.1/32
logging:
  level: info
