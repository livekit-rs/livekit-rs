<!doctype html><meta charset="utf-8"><script src="/sdk.js"></script><script>
const{Room,RoomEvent,Track}=LivekitClient;let room,video,context,pc,stream,locationUrl,etag,timer,canvas,context2d,remoteTrack;
const state={frames:0,lastWidth:0,lastHeight:0,errors:[]};
window.videoFixture={
 async observe({url,token,identity}){room=new Room({adaptiveStream:false,dynacast:false});room.on(RoomEvent.TrackSubscribed,(track,publication,participant)=>{if(track.kind!==Track.Kind.Video||participant.identity!==identity)return;remoteTrack=track;video=track.attach();video.autoplay=true;video.muted=true;video.playsInline=true;document.body.append(video);video.play().catch(e=>state.errors.push(String(e.message)));function frame(now,metadata){state.frames++;state.lastWidth=metadata.width;state.lastHeight=metadata.height;if(video)video.requestVideoFrameCallback(frame);}video.requestVideoFrameCallback(frame);});await room.connect(url,token,{autoSubscribe:true});},
 async publish({url,token,codec}){canvas=document.createElement('canvas');canvas.width=640;canvas.height=360;context2d=canvas.getContext('2d');let phase=0;timer=setInterval(()=>{context2d.fillStyle=`hsl(${phase++*7%360} 90% 50%)`;context2d.fillRect(0,0,canvas.width,canvas.height);context2d.fillStyle='white';context2d.fillRect((phase*11)%canvas.width,30,60,80);},50);stream=canvas.captureStream(20);pc=new RTCPeerConnection({iceServers:[]});const transceiver=pc.addTransceiver(stream.getVideoTracks()[0],{direction:'sendonly',streams:[stream],sendEncodings:[{maxBitrate:3_000_000,...(codec==='AV1'?{scalabilityMode:'L3T3_KEY'}:{})}]});const available=RTCRtpSender.getCapabilities('video').codecs,chosen=available.filter(c=>c.mimeType.toLowerCase()===`video/${codec.toLowerCase()}`);if(!chosen.length)throw Error(`actual browser does not support required ${codec}`);transceiver.setCodecPreferences([...chosen,...available.filter(c=>c.mimeType.toLowerCase()==='video/rtx')]);const offer=await pc.createOffer();await pc.setLocalDescription(offer);if(pc.iceGatheringState!=='complete')await new Promise((resolve,reject)=>{const end=setTimeout(()=>reject(Error('actual ICE gathering deadline')),10000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(end);resolve();}});});const response=await fetch(url.replace(/^ws/,'http')+'/whip/v1',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/sdp'},body:pc.localDescription.sdp});if(response.status!==201)throw Error(`actual WHIP ${response.status}`);locationUrl=new URL(response.headers.get('location'),url.replace(/^ws/,'http')).href;etag=response.headers.get('etag');if(!etag)throw Error('actual resource has no ICE tag');await pc.setRemoteDescription({type:'answer',sdp:await response.text()});},
 resize(){canvas.width=960;canvas.height=540;},
 async snapshot({diagnostic=false}={}){
  const result={...state,video:video?{width:video.videoWidth,height:video.videoHeight,paused:video.paused,readyState:video.readyState}:null,selectedCodecs:[],outbound:[],inbound:[]};
  const fields=['packetsSent','bytesSent','framesEncoded','framesSent','frameWidth','frameHeight','framesPerSecond','keyFramesEncoded','retransmittedPacketsSent','totalEncodeTime','qualityLimitationReason','packetsReceived','bytesReceived','packetsLost','framesReceived','framesDecoded','keyFramesDecoded','framesDropped','freezeCount','totalFreezesDuration','jitter','pliCount','nackCount'];
  function summary(reports,type){const values=[];for(const r of reports.values())if(r.type===type&&(r.kind==='video'||r.mediaType==='video')){const row={};for(const k of fields)if(r[k]!==undefined)row[k]=r[k];const codec=reports.get(r.codecId);if(codec)row.mimeType=codec.mimeType;values.push(row);}return values;}
  if(pc){result.pc={connectionState:pc.connectionState,iceConnectionState:pc.iceConnectionState,signalingState:pc.signalingState};result.canvas=canvas?{width:canvas.width,height:canvas.height}:null;result.source=stream?.getVideoTracks().map(t=>({enabled:t.enabled,muted:t.muted,readyState:t.readyState,...Object.fromEntries(Object.entries(t.getSettings()).filter(([k])=>['width','height','frameRate','aspectRatio','resizeMode'].includes(k)))}));const reports=await pc.getStats();result.outbound=summary(reports,'outbound-rtp');for(const row of result.outbound)if(row.mimeType)result.selectedCodecs.push(row.mimeType);}
  if(remoteTrack&&diagnostic){result.remoteTrack={enabled:remoteTrack.mediaStreamTrack.enabled,muted:remoteTrack.mediaStreamTrack.muted,readyState:remoteTrack.mediaStreamTrack.readyState};const reports=await remoteTrack.getRTCStatsReport();if(reports)result.inbound=summary(reports,'inbound-rtp');}
  return result;
 },
 async remove({token}){const response=await fetch(locationUrl,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});return response.status;},
 async close(){clearInterval(timer);pc?.close();for(const t of stream?.getTracks()||[])t.stop();if(video){video.pause();video.srcObject=null;video.remove();video=null;}await room?.disconnect();}
};
</script>
