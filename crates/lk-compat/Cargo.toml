[package]
name = "lk-compat"
description = "LiveKit v1.13.10 compatibility adapter: JWT auth, Twirp server API, webhooks, signaling"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lk-protocol.workspace = true
rtc-core.workspace = true
rtc-tls.workspace = true
rtc-runtime.workspace = true
rtc-turn.workspace = true
axum.workspace = true
# Feature-only edge: uses Axum's already selected0.29 transport, not a new socket stack.
tungstenite = { version = "=0.29.0", default-features = false, features = ["livekit-server-close-reply-empty-reason", "livekit-server-header-read-budget"] }
tower.workspace = true
tower-http.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
regex = "=1.13.1"
time = "=0.3.55"
tokio.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
prost.workspace = true
prost-reflect.workspace = true
pbjson-types.workspace = true
jsonwebtoken.workspace = true
base64.workspace = true
sha2.workspace = true
sha1.workspace = true
hmac.workspace = true
reqwest.workspace = true
redis.workspace = true
tokio-rustls.workspace = true
flate2.workspace = true
getrandom.workspace = true
thiserror.workspace = true
tracing.workspace = true
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
# `healthCheck` renders Go's `time.Time.String()` zone suffix, which needs the
# host C library's local zone (`localtime_r`/`tm_gmtoff`/`tm_zone`) — the same
# source `livecloud` already uses for interface enumeration.
libc.workspace = true

[dev-dependencies]
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "testing"] }
futures-util = { workspace = true, features = ["async-await"] }
# Paused-time control for the WebTransport agent control-plane handshake deadline.
tokio = { version = "=1.54.1", features = ["test-util"] }
# Exercise assembly and join profiles with the real normalized CLI config.
lk-config.workspace = true

# Actual PSRPC expiry acceptance over original native ICE/DTLS/SCTP fixture.
str0m.workspace = true
rtc-crypto.workspace = true
