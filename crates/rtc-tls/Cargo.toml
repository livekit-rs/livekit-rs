[package]
name = "rtc-tls"
description = "Explicit RustCrypto TLS 1.2/1.3 provider with verified certificate and key compatibility"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# SPEC-0074 C15: opt-in Quinn `crypto::{Session,ClientConfig,ServerConfig}`
# adapter over the pure-Rust QUIC bridge. Off by default so the widely-depended
# rtc-tls graph stays free of the QUIC transport crate; enabling it pulls
# quinn-proto with `default-features = false` (no rustls-ring / ring / aws-lc).
quinn = ["dep:quinn-proto"]

[dependencies]
rustls = { version = "=0.23.46", default-features = false, features = ["std", "custom-provider", "tls12"] }
lk-quic-crypto.workspace = true
quinn-proto = { workspace = true, optional = true }
tokio-rustls = { version = "=0.26.6", default-features = false }
rustls-pki-types = { version = "=1.15.1", features = ["std"] }
webpki-roots = "=1.0.10"
p256 = { workspace = true, features = ["ecdh"] }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
aes-gcm.workspace = true
hmac.workspace = true
sha2.workspace = true
getrandom.workspace = true
thiserror.workspace = true
tokio.workspace = true
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1"] }
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "=0.1.5"
bytes.workspace = true
url = "=2.5.8"

# Expanded adapters use stable AEAD 0.6 traits. Existing media/SRTP retains its
# compatible workspace AEAD 0.5 dependency until that interface is migrated.
aead = { version = "=0.6.1", default-features = false, features = ["alloc"] }
aes-gcm-next = { package = "aes-gcm", version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
# Raw ChaCha20 is needed for RFC 9001 header protection (already locked).
chacha20 = { version = "=0.10.2", default-features = false, features = ["cipher"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["pkcs8", "alloc", "zeroize"] }
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }

# Public verification only; see RSA-PUBLIC-ONLY.md before changing any use.
rsa = { version = "=0.9.10", default-features = false, features = ["std", "sha2"] }

crypto-bigint = { version = "=0.7.10", default-features = false, features = ["alloc", "zeroize"] }
zeroize = { version = "=1.9.1", features = ["alloc"] }

p521 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "pkcs8", "std"] }

rustls-native-certs = "=0.8.5"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"

[target.'cfg(target_os = "windows")'.dependencies]
schannel = "=0.1.30"
